services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      MCP_PYTHON_PATH: /usr/local/bin/python
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./fitness_mcp:/app/fitness_mcp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - frontend/.env
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  frontend_next:
